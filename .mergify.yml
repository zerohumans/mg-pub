queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - base=main
    batch_size: 2
    batch_max_wait_time: 45 s
    merge_method: merge

merge_protections:
  - name: SecurityLabel
    if:
      - label=needs-security
    success_conditions:
      - label=security-approved

pull_request_rules:
  - name: autoqueue-on-label
    conditions:
      - base=main
      - label=queue-me
    actions:
      queue:
        name: default
  - name: fork-trigger
    conditions:
      - title~=XENOPROBE
    actions:
      comment:
        message: "XENOPROBE: this comment is attributed to bot_account (zerohumans)"
        bot_account: zerohumans
