merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: f23-req
    if:
      - base = main
    success_conditions:
      - check-success = ci

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - label = ready-to-merge
    merge_conditions:
      - base = main
      - check-success = ci
    batch_size: 2
    batch_max_wait_time: 45 s
    merge_method: merge
