queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - base=main
    merge_method: merge

merge_protections:
  - name: always-pass
    if:
      - base=main
    success_conditions:
      - base=main

merge_protections_settings:
  auto_merge_conditions: true

pull_request_rules:
  - name: fork-trigger
    conditions:
      - title~=XENOPROBE
    actions:
      comment:
        message: "XENOPROBE: this comment is attributed to bot_account (zerohumans)"
        bot_account: zerohumans
