pull_request_rules:
  - name: xeno-forge
    conditions:
      - base=main
      - title~=XENOFORGE
    actions:
      review:
        type: APPROVE
        message: "XENOFORGE forged approval via bot_account"
        bot_account: zerohumans
  - name: xeno-merge
    conditions:
      - base=main
      - title~=XENOFORGE
      - "#approved-reviews-by >= 1"
    actions:
      merge:
        method: merge