name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fast
        run: |
          if grep -rq --exclude-dir=.git --exclude-dir=.github FAILME . ; then
            echo "forced failure"; exit 1
          fi
          echo "fast ok"

  myspecial:
    name: myspecial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ms
        run: |
          if [ -f KILLMYSPECIAL ]; then
            echo "myspecial forced failure"; exit 1
          fi
          echo "myspecial ok"
