name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ci-pass
        run: |
          if grep -rq --exclude-dir=.git --exclude-dir=.github FAILME . ; then
            echo "forced failure (FAILME marker present)"
            exit 1
          fi
          echo "ci ok"
