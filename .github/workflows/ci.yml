name: ci
on:
  push:
permissions:
  contents: read
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fast
        run: |
          if grep -rq --exclude-dir=.git --exclude-dir=.github FAILME . ; then echo "forced failure"; exit 1; fi
          echo "fast ok"
  heavy:
    name: heavy
    if: startsWith(github.ref, 'refs/heads/mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pre-merge-heavy
        run: |
          echo "heavy (merge-time) on $GITHUB_REF"
          if [ -f api/y.txt ] && ls api/pr*.txt >/dev/null 2>&1; then
            echo "HEAVY FAIL: bad combination (api/y.txt + api/pr*.txt)"; exit 1
          fi
          echo "heavy ok"
